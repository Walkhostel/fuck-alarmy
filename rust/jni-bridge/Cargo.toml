[package]
name = "mathalarm-jni-bridge"
version = "0.1.0"
edition = "2021"

# cdylib -> libmathalarm_core.so, грузится через System.loadLibrary("mathalarm_core")
[lib]
name = "mathalarm_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
mathalarm-core = { path = "../core" }

[profile.release]
lto = true
strip = true
